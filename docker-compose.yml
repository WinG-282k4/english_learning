services:
  vocab-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocab-app
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SECRET_KEY=${SECRET_KEY:-default-secret-key-change-in-prod-32bytes}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
