server:
  port: 8080

spring:
  application:
    name: vocab-service

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  datasource:
    url: jdbc:h2:file:./data/vocabdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
      thread-name-prefix: async-import-

app:
  rules:
    max-prev-topics: 3
    random-past-wrong-count: 3
    resolve-wrong-threshold: 3
  crypto:
    secret-key: ${SECRET_KEY:default-secret-key-change-in-prod-32bytes}
  llm:
    default-provider: GROQ
    timeout-seconds: 15
